<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foco: imagem ↔ frase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Imagem de fundo -->
    <div class="card-bg" id="bgImage"></div>
    
    <!-- Overlay -->
    <div class="card-overlay" id="overlay"></div>
    
    <!-- Texto com a palavra foucus -->
    <div class="card-text">
        <p>
            <span class="highlight" id="focusWord">foucus</span>
        </p>
    </div>
    
    <div class="hint">passe o mouse</div>

    <script>
        const bgImage = document.getElementById('bgImage');
        const overlay = document.getElementById('overlay');
        const focusWord = document.getElementById('focusWord');
        const textElement = document.querySelector('.card-text p');

        // Quando o mouse passa pela palavra "foucus"
        focusWord.addEventListener('mouseenter', () => {
            // Imagem desfoca
            bgImage.style.filter = 'blur(8px) brightness(0.6)';
            overlay.style.background = 'rgba(10, 10, 20, 0.4)';
            // Palavra fica em foco (já está)
        });

        focusWord.addEventListener('mouseleave', () => {
            // Imagem volta ao foco
            bgImage.style.filter = 'blur(0px) brightness(1)';
            overlay.style.background = 'rgba(10, 10, 20, 0.2)';
        });

        // Quando o mouse passa pela imagem
        bgImage.addEventListener('mouseenter', () => {
            // Frase desfoca
            textElement.style.filter = 'blur(5px)';
            textElement.style.textShadow = '0 4px 20px rgba(0, 0, 0, 0.3)';
        });

        bgImage.addEventListener('mouseleave', () => {
            // Frase volta ao foco
            textElement.style.filter = 'blur(0px)';
            textElement.style.textShadow = '0 4px 30px rgba(0, 0, 0, 0.7)';
        });
    </script>
</body>
</html>
