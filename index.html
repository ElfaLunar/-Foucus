<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foco: imagem ↔ frase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Imagem de fundo (ocupando toda a tela) -->
    <div class="card-bg"></div>
    
    <!-- Overlay para efeitos de desfoque/escurecimento -->
    <div class="card-overlay"></div>
    
    <!-- Camada de texto central -->
    <div class="card-text">
        <p>
            <span class="highlight">focus</span>
        </p>
    </div>
    
    <div class="hint">passe o mouse</div>
</body>
</html>
